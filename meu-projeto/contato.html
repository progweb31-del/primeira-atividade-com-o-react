<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="contato.css" />
    <title>contato</title>
  </head>
  <body>
    <form action="./index.html" method="get">
      <h1 style="text-align: center">Pagina de contato</h1>
      <label for="nome">Nome:</label><br />
      <input type="text" /><br /><br />

      <label for="email">Email:</label><br />
      <input type="email" name="Email" required /><br /><br />

      <label for="motivo">Motivo do contato</label><br />
      <input type="text" /><br /><br />

      <label for="mensagem" required>Mensagem:</label><br />
      <input type="text" style="width: 50%; height: 2%" /><br /><br />

      <button type="submit" id="botao">enviar</button>
    </form>
    <script>
      function b() {
        alert("Parabéns os dados foram enviados com sucesso");
      }

      const botao = document.getElementById("botao");

      botao.addEventListener("click", b);
    </script>
  </body>
</html>
